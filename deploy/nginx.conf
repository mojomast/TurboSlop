# TurboSlop — nginx reverse proxy
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/turboslop
#   sudo ln -s /etc/nginx/sites-available/turboslop /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Terminate TLS here (certbot), never in the app.

upstream turboslop {
    server 127.0.0.1:4400;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name turboslop.example.com;
    # certbot will add the redirect to 443
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name turboslop.example.com;

    ssl_certificate     /etc/letsencrypt/live/turboslop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/turboslop.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Generated pages and artwork can be large.
    client_max_body_size 2m;

    # Image generation is slow; do not cut the SSE stream short.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://turboslop;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events: no buffering, no compression, no chunked rewrite.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
    }

    # Immutable generated artwork.
    location /assets/ {
        proxy_pass http://turboslop;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
